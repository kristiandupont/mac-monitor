<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mac Monitor — Lightweight macOS System Monitor</title>
    <meta name="description" content="A lightweight, unobtrusive macOS system monitor. A subtle rotating menu bar icon tracks CPU load. A full web dashboard lets you check in from any browser." />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        font-weight: 300;
        font-size: 16px;
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn-primary {
        background: #21262d;
        border: 1px solid #30363d;
        color: #e6edf3;
      }
      .btn-primary:hover { background: #30363d; border-color: #484f58; transform: translateY(-2px); }
      .btn-ghost {
        background: transparent;
        border: 1px solid #30363d;
        color: #8b949e;
        cursor: not-allowed;
        opacity: 0.45;
      }

      .section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #8b949e;
        margin-bottom: 12px;
      }

      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
        margin-bottom: 100px;
      }
      @media (max-width: 768px) {
        .feature-grid { grid-template-columns: 1fr; gap: 40px; margin-bottom: 64px; }
        .feature-grid .demo-col { order: -1; }
      }

      .footer-link { transition: color 0.2s; }
      .footer-link:hover { color: #e6edf3; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
